<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}pastebin{% endblock %}</title>
<style>
  :root{
    --bg:#111322; --panel:#181b2e; --line:#272b45; --text:#e8eaf6; --muted:#8f96b8;
    --indigo:#7c8cff; --pink:#ff7ab6; --ok:#42d392; --bad:#ff6b81; --code:#0d0f1c;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:15px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{display:flex;align-items:center;gap:16px;padding:14px 22px;
         border-bottom:1px solid var(--line);background:#141730}
  .brand{font-family:ui-monospace,Consolas,monospace;font-weight:700;color:var(--pink);
         letter-spacing:.5px}
  .brand small{color:var(--muted);font-weight:400}
  nav{margin-left:auto;display:flex;gap:8px}
  nav a{color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:8px;font-size:14px}
  nav a:hover{background:#20243d;color:var(--text)}
  main{max-width:880px;margin:26px auto 0;padding:0 18px}
  h1{font-size:21px;margin:0 0 4px}
  h2{font-size:15px;color:var(--muted);margin:24px 0 8px;font-weight:600}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:14px 0}
  label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
  input,select,textarea{width:100%;background:var(--code);color:var(--text);
        border:1px solid var(--line);border-radius:9px;padding:9px 11px;font:inherit}
  textarea{min-height:190px;font-family:ui-monospace,Consolas,monospace;font-size:13.5px}
  .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
  button{margin-top:16px;padding:9px 18px;border:0;border-radius:9px;cursor:pointer;
         background:var(--indigo);color:#0b0d1f;font-weight:700;font:inherit}
  .row{display:flex;align-items:center;gap:10px}
  .chk{display:flex;align-items:center;gap:8px;margin-top:14px;color:var(--muted);font-size:14px}
  .chk input{width:auto}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600}
  code,pre,.mono{font-family:ui-monospace,Consolas,monospace}
  pre{background:var(--code);border:1px solid var(--line);border-radius:10px;
      padding:12px;overflow:auto;white-space:pre-wrap;margin:0}
  .tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;
       border:1px solid var(--line);color:var(--muted)}
  .ok{color:var(--ok)} .bad{color:var(--bad)} .warn{color:#ffc46b}
  .notice{border-radius:10px;padding:10px 12px;margin:12px 0;font-size:14px;
       border:1px solid #ff6b8140;background:#2a1622;color:var(--bad)}
  footer{max-width:880px;margin:28px auto 40px;padding:0 18px;color:var(--muted);font-size:13px}
  footer code{color:var(--text)}
</style>
</head>
<body>
<header>
  <div class="brand">pastebin <small>· encrypted pastes</small></div>
  <nav>
    <a href="{{ url_for('index') }}">New paste</a>
    {% if token is defined %}
      <a href="{{ url_for('view_page', token=token) }}">This paste</a>
    {% endif %}
  </nav>
</header>
<main>
  {% block content %}{% endblock %}
</main>
<footer>
  JSON API: <code>POST /api/pastes</code> &middot; <code>GET /p/token</code> &middot;
  <code>DELETE /p/token</code>. Ciphertext is AES-256-GCM over a
  PBKDF2-HMAC-SHA256 key derived from your password.
</footer>
</body>
</html>
